<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KHIA eKYC Suite - 실시간 검증 관제 콘솔</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#FAFAFA] text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ 배포된 Google Apps Script Web App URL(exec)을 대입하세요.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxInC9pbK07jWS55Bc34E2mCWA8Kj_gkwxlzn4tCDuT-NH3rksNZd2uo9x3XVAWpmyC/exec";

    /**
     * Google Apps Script Headless 백엔드 통신 헬퍼 함수
     * CORS Preflight 회피를 위해 text/plain 스트림으로 POST 전송합니다.
     */
    async function callAdminApi(action, payload = {}) {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      return await response.json();
    }

    const IconWrapper = ({ children, className = "w-4 h-4", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const Shield = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconWrapper>;
    const ShieldCheck = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconWrapper>;
    const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
    const RefreshCw = (p) => <IconWrapper {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconWrapper>;
    const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
    const Scan = (p) => <IconWrapper {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></IconWrapper>;
    const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
    const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
    const Key = (p) => <IconWrapper {...p}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconWrapper>;
    const Check = (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12"/></IconWrapper>;
    const X = (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
    const ExternalLink = (p) => <IconWrapper {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></IconWrapper>;
    const ChevronRight = (p) => <IconWrapper {...p}><polyline points="9 18 15 12 9 6"/></IconWrapper>;

    function getDirectImageUrl(url) {
      if (!url || typeof url !== 'string' || !url.startsWith('http')) return null;
      const match = url.match(/[-\w]{25,}/);
      if (match) {
        return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w800`;
      }
      return url;
    }

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [isChangePinOpen, setIsChangePinOpen] = useState(false);
      const [oldPinInput, setOldPinInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [changePinMsg, setChangePinMsg] = useState({ text: '', isError: false });

      const [applications, setApplications] = useState([]);
      const [connectedSheetInfo, setConnectedSheetInfo] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatusFilter, setSelectedStatusFilter] = useState('ALL');
      const [activeInspectorItem, setActiveInspectorItem] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setPinError('');
        if (!pinInput.trim()) {
          setPinError('비밀번호를 입력해 주세요.');
          return;
        }

        try {
          const res = await callAdminApi('verifyAdminPin', { pin: pinInput });
          if (res.success) {
            setAdminPin(pinInput);
            setIsAuthenticated(true);
            loadData(pinInput);
          } else {
            setPinError('비밀번호가 올바르지 않습니다.');
          }
        } catch (err) {
          setPinError('통신 오류: ' + err.message);
        }
      };

      const loadData = async (pin) => {
        setIsLoading(true);
        setErrorMessage('');
        try {
          const res = await callAdminApi('fetchApplications', { pin: pin || adminPin });
          setIsLoading(false);
          if (res && res.success && res.list) {
            setApplications(res.list);
            setConnectedSheetInfo(`연동 시트: [${res.sheetName}] · 총 ${res.totalRows}건 감지`);
            if (res.list.length === 0) {
              setErrorMessage(`시트 [${res.sheetName}]에 데이터가 비어 있습니다.`);
            }
          } else {
            setErrorMessage(res.message || '데이터를 불러오지 못했습니다.');
          }
        } catch (err) {
          setIsLoading(false);
          setErrorMessage('시트 데이터 로드 실패: ' + err.message);
        }
      };

      const handleUpdateStatus = async (rowNumber, newStatus, defaultNote) => {
        const note = prompt(`심사 사유 또는 메모를 입력해 주세요:`, defaultNote) || defaultNote;
        
        try {
          const res = await callAdminApi('updateApplicationStatus', {
            rowNumber,
            newStatus,
            note,
            pin: adminPin
          });

          if (res.success) {
            setApplications(prev => prev.map(app => 
              app.rowNumber === rowNumber 
                ? { ...app, status: newStatus, reviewerNote: `${note} (반영완료)` } 
                : app
            ));
            if (activeInspectorItem && activeInspectorItem.rowNumber === rowNumber) {
              setActiveInspectorItem(prev => ({ ...prev, status: newStatus, reviewerNote: `${note} (반영완료)` }));
            }
            showToast(`심사 상태가 성공적으로 반영되었습니다.`);
          } else {
            alert(res.message);
          }
        } catch (err) {
          alert('처리 중 통신 오류 발생: ' + err.message);
        }
      };

      const handleChangePin = async (e) => {
        e.preventDefault();
        setChangePinMsg({ text: '', isError: false });
        try {
          const res = await callAdminApi('changeAdminPin', {
            oldPin: oldPinInput,
            newPin: newPinInput
          });

          if (res.success) {
            setAdminPin(newPinInput);
            setChangePinMsg({ text: res.message, isError: false });
            setTimeout(() => {
              setIsChangePinOpen(false);
              setOldPinInput('');
              setNewPinInput('');
              setChangePinMsg({ text: '', isError: false });
            }, 1500);
          } else {
            setChangePinMsg({ text: res.message, isError: true });
          }
        } catch (err) {
          setChangePinMsg({ text: '통신 오류: ' + err.message, isError: true });
        }
      };

      const filteredApplications = useMemo(() => {
        return applications.filter(app => {
          const matchSearch = app.name.includes(searchQuery) ||
                              app.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              app.phone.includes(searchQuery) ||
                              app.cafeNickname.includes(searchQuery);
          const matchStatus = selectedStatusFilter === 'ALL' || app.status === selectedStatusFilter;
          return matchSearch && matchStatus;
        });
      }, [applications, searchQuery, selectedStatusFilter]);

      const totalCount = applications.length;
      const approvedCount = applications.filter(a => a.status === 'APPROVED').length;
      const pendingCount = applications.filter(a => a.status === 'PENDING' || a.status === 'REVIEWING').length;
      const approvalRate = totalCount > 0 ? ((approvedCount / totalCount) * 100).toFixed(1) : '0.0';

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#F4F7FB] flex items-center justify-center p-4">
            <div className="bg-white max-w-md w-full p-8 rounded-3xl shadow-xl border border-zinc-200 text-center">
              <div className="w-14 h-14 bg-[#14428B] text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-900/20">
                <Lock className="w-7 h-7" />
              </div>
              <h2 className="text-xl font-bold text-zinc-900">KHIA eKYC 관제 콘솔</h2>
              <p className="text-xs text-zinc-500 mt-1 mb-6">회원 자격 심사 및 승인을 위한 보안 비밀번호를 입력해 주세요.</p>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="비밀번호 입력 (기본: 1234)"
                    className="w-full text-center tracking-widest text-lg font-bold px-4 py-3.5 bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:border-[#14428B] focus:bg-white transition"
                    autoFocus
                  />
                  {pinError && <p className="text-xs font-semibold text-rose-600 mt-2">{pinError}</p>}
                </div>
                <button
                  type="submit"
                  className="w-full py-3.5 bg-[#14428B] hover:bg-[#0c2b5c] text-white font-bold text-sm rounded-xl transition shadow-md active:scale-98"
                >
                  보안 로그인
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#FAFAFA] text-zinc-900 font-sans flex flex-col">
          {toastMessage && (
            <div className="fixed top-6 right-6 z-50 flex items-center gap-3 bg-zinc-900 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-zinc-700">
              <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
              <span className="text-sm font-medium">{toastMessage}</span>
              <button onClick={() => setToastMessage(null)} className="ml-2 text-zinc-400 hover:text-white">
                <X className="w-4 h-4" />
              </button>
            </div>
          )}

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-zinc-200 px-4 lg:px-8 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-[#14428B] flex items-center justify-center text-white shadow-md">
                  <ShieldCheck className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-base tracking-tight text-zinc-900">KHIA eKYC Suite</span>
                    <span className="px-1.5 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 rounded border border-blue-200">GitHub Live</span>
                  </div>
                  <p className="text-xs text-zinc-500">사단법인 한국비어업인수산자원보호협회 자격 검증 관제</p>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                {connectedSheetInfo && (
                  <span className="hidden sm:inline-block text-xs font-semibold px-2.5 py-1 bg-zinc-100 text-zinc-600 rounded-lg border border-zinc-200">
                    {connectedSheetInfo}
                  </span>
                )}
                <button
                  onClick={() => setIsChangePinOpen(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-200 bg-white text-zinc-700 hover:bg-zinc-50 text-xs font-semibold transition"
                >
                  <Key className="w-3.5 h-3.5" />
                  비밀번호 변경
                </button>
                <button
                  onClick={() => loadData()}
                  className="p-2 text-zinc-500 hover:text-zinc-900 rounded-lg hover:bg-zinc-100 transition"
                  title="새로고침"
                >
                  <RefreshCw className={`w-4 h-4 ${isLoading ? 'animate-spin text-[#14428B]' : ''}`} />
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            {errorMessage && (
              <div className="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-2xl text-xs font-semibold">
                ⚠️ {errorMessage}
              </div>
            )}

            <div>
              <h1 className="text-2xl font-bold tracking-tight text-zinc-900">eKYC 실시간 검증 운영 콘솔</h1>
              <p className="text-sm text-zinc-500 mt-0.5">회원 등록 사진과 자격 증빙을 대조하여 실시간으로 승인 또는 반려합니다.</p>
            </div>

            {/* 통계 지표 카드 */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-xs">
                <div className="flex items-center justify-between text-zinc-500 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider">총 접수 건수</span>
                  <div className="w-8 h-8 rounded-lg bg-zinc-100 flex items-center justify-center text-zinc-700"><Scan className="w-4 h-4" /></div>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-2xl font-black tracking-tight text-zinc-900">{totalCount}건</span>
                </div>
                <p className="text-xs text-zinc-400 mt-2">구글 시트 실시간 연동</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-xs">
                <div className="flex items-center justify-between text-zinc-500 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider">승인 완료율</span>
                  <div className="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600"><Zap className="w-4 h-4" /></div>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-2xl font-black tracking-tight text-zinc-900">{approvalRate}%</span>
                  <span className="text-xs font-medium text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">{approvedCount}명 완료</span>
                </div>
                <div className="w-full bg-zinc-100 h-1.5 rounded-full mt-2.5 overflow-hidden">
                  <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${approvalRate}%` }}></div>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-xs">
                <div className="flex items-center justify-between text-zinc-500 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider">심사 대기열</span>
                  <div className="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center text-amber-600"><Clock className="w-4 h-4" /></div>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-2xl font-black tracking-tight text-zinc-900">{pendingCount}건</span>
                  <span className="text-xs font-medium text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">집중 검토</span>
                </div>
                <p className="text-xs text-zinc-400 mt-2">수동 승인/반려 대기</p>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-xs">
                <div className="flex items-center justify-between text-zinc-500 mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider">보안 프로토콜</span>
                  <div className="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-[#14428B]"><Shield className="w-4 h-4" /></div>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="text-lg font-bold text-zinc-900">PIN 인증 가동</span>
                </div>
                <p className="text-xs text-zinc-400 mt-2">암호화 세션 유지 중</p>
              </div>
            </div>

            {/* 검색 및 필터 바 */}
            <div className="bg-white p-4 rounded-2xl border border-zinc-200 shadow-xs flex flex-col md:flex-row gap-3 items-center justify-between">
              <div className="relative w-full md:w-80">
                <Search className="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="이름, 접수번호, 전화번호, 카페별명..."
                  className="w-full bg-zinc-50 text-sm pl-9 pr-4 py-2 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900 focus:bg-white transition"
                />
              </div>

              <div className="flex items-center gap-2 w-full md:w-auto">
                <select
                  value={selectedStatusFilter}
                  onChange={(e) => setSelectedStatusFilter(e.target.value)}
                  className="bg-zinc-50 text-xs font-medium text-zinc-700 px-3 py-2 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900"
                >
                  <option value="ALL">전체 심사 상태</option>
                  <option value="PENDING">심사 대기 (PENDING)</option>
                  <option value="APPROVED">승인 완료 (APPROVED)</option>
                  <option value="REJECTED">반려됨 (REJECTED)</option>
                  <option value="RETAKE_REQUESTED">재촬영 요청 (RETAKE)</option>
                </select>
              </div>
            </div>

            {/* 실시간 신청자 데이터 테이블 */}
            <div className="bg-white rounded-2xl border border-zinc-200 shadow-xs overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm border-collapse">
                  <thead>
                    <tr className="bg-zinc-50/70 text-zinc-500 text-xs font-semibold border-b border-zinc-200">
                      <th className="py-3.5 px-4 pl-6">접수번호 / 성명(생년)</th>
                      <th className="py-3.5 px-4">소속단체</th>
                      <th className="py-3.5 px-4">신원인증 / 안전교육</th>
                      <th className="py-3.5 px-4">휴대전화</th>
                      <th className="py-3.5 px-4">심사 상태</th>
                      <th className="py-3.5 px-4">접수 시간</th>
                      <th className="py-3.5 px-4 pr-6 text-right">상세 심사</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-100">
                    {filteredApplications.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="py-12 text-center text-zinc-400 text-sm">
                          {isLoading ? '구글 시트 데이터를 불러오는 중입니다...' : '검색 결과에 해당하는 신청 내역이 없습니다.'}
                        </td>
                      </tr>
                    ) : (
                      filteredApplications.map((app) => (
                        <tr key={app.id} onClick={() => setActiveInspectorItem(app)} className="hover:bg-zinc-50/80 cursor-pointer transition">
                          <td className="py-4 px-4 pl-6">
                            <div className="font-bold text-zinc-900">{app.name} <span className="text-xs text-zinc-500 font-normal">({app.birth})</span></div>
                            <div className="text-xs font-mono text-zinc-400">{app.id}</div>
                          </td>
                          <td className="py-4 px-4 text-xs font-medium text-zinc-700 max-w-[180px] truncate" title={app.organization}>
                            {app.organization || '-'}
                          </td>
                          <td className="py-4 px-4 text-xs">
                            <div className="font-semibold text-zinc-800">{app.identityAuth}</div>
                            <div className="text-zinc-400 truncate max-w-[160px]" title={app.safetyEdu}>{app.safetyEdu || '-'}</div>
                          </td>
                          <td className="py-4 px-4 font-mono text-xs text-zinc-700">{app.phone}</td>
                          <td className="py-4 px-4">
                            <StatusBadge status={app.status} />
                          </td>
                          <td className="py-4 px-4 text-xs text-zinc-400">{app.serverTimestamp}</td>
                          <td className="py-4 px-4 pr-6 text-right">
                            <button className="text-xs font-bold px-3 py-1.5 rounded-lg bg-zinc-900 text-white hover:bg-zinc-800 transition inline-flex items-center gap-1">
                              검토 <ChevronRight className="w-3.5 h-3.5" />
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* 상세 검토 모달 */}
          {activeInspectorItem && (
            <InspectorModal
              item={activeInspectorItem}
              onClose={() => setActiveInspectorItem(null)}
              onUpdateStatus={handleUpdateStatus}
            />
          )}

          {/* 비밀번호 변경 모달 */}
          {isChangePinOpen && (
            <ChangePinModal
              onClose={() => setIsChangePinOpen(false)}
              onSubmit={handleChangePin}
              oldPin={oldPinInput}
              setOldPin={setOldPinInput}
              newPin={newPinInput}
              setNewPin={setNewPinInput}
              message={changePinMsg}
            />
          )}
        </div>
      );
    }

    function StatusBadge({ status }) {
      switch (status) {
        case 'APPROVED':
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"><CheckCircle2 className="w-3 h-3" />승인 완료</span>;
        case 'PENDING':
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200"><Clock className="w-3 h-3" />심사 대기</span>;
        case 'REVIEWING':
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200"><Shield className="w-3 h-3" />정밀 분석중</span>;
        case 'REJECTED':
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200"><XCircle className="w-3 h-3" />반려됨</span>;
        case 'RETAKE_REQUESTED':
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">재촬영 요청</span>;
        default:
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-zinc-100 text-zinc-700">{status}</span>;
      }
    }

    function InspectorModal({ item, onClose, onUpdateStatus }) {
      const certDocImg = getDirectImageUrl(item.certDoc);
      const memberPhotoImg = getDirectImageUrl(item.memberPhoto);
      const profilePhotoImg = getDirectImageUrl(item.profileImg);

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-4xl max-h-[92vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-zinc-200">
            <div className="px-6 py-4 border-b border-zinc-200 flex items-center justify-between bg-zinc-50/70">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-zinc-200 overflow-hidden border">
                  {profilePhotoImg ? <img src={profilePhotoImg} alt="프로필" className="w-full h-full object-cover" /> : <div className="flex items-center justify-center h-full text-xs font-bold">KHIA</div>}
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-lg font-bold text-zinc-900">{item.name}</h3>
                    <span className="text-xs font-mono bg-zinc-200 text-zinc-700 px-2 py-0.5 rounded">생년: {item.birth}</span>
                    <StatusBadge status={item.status} />
                  </div>
                  <p className="text-xs text-zinc-500 mt-0.5">{item.id} · 접수: {item.serverTimestamp} · 소속: {item.organization}</p>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center text-zinc-600 transition">
                <X className="w-4 h-4" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* 좌측: 자격증빙 서류 사본 */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-zinc-800 uppercase flex items-center gap-1.5">
                      <ShieldCheck className="w-4 h-4 text-blue-600" /> 자격증빙 서류 사본
                    </span>
                    {item.certDoc && item.certDoc.startsWith('http') && (
                      <a href={item.certDoc} target="_blank" rel="noopener noreferrer" className="text-[11px] font-medium text-blue-600 hover:underline flex items-center gap-0.5">
                        원본 열람 <ExternalLink className="w-3 h-3" />
                      </a>
                    )}
                  </div>
                  <div className="relative aspect-[1.4/1] rounded-2xl bg-zinc-100 overflow-hidden border border-zinc-200 flex items-center justify-center">
                    {certDocImg ? (
                      <img src={certDocImg} alt="자격증빙" className="w-full h-full object-contain" />
                    ) : (
                      <div className="text-xs text-zinc-400 font-medium">첨부된 자격증빙이 없습니다.</div>
                    )}
                  </div>
                  <div className="bg-zinc-50 p-3 rounded-xl border border-zinc-200 text-xs space-y-1.5">
                    <div className="flex justify-between text-zinc-600"><span>보유 자격</span><span className="font-bold text-zinc-900">{item.qualifications || '미취득'}</span></div>
                    <div className="flex justify-between text-zinc-600"><span>안전교육</span><span className="font-semibold text-zinc-800">{item.safetyEdu || '미이수'}</span></div>
                  </div>
                </div>

                {/* 우측: 공무 조회용 실물 정면 사진 */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-zinc-800 uppercase flex items-center gap-1.5">
                      <Scan className="w-4 h-4 text-emerald-600" /> 공무 조회용 실물 정면 사진
                    </span>
                    {item.memberPhoto && item.memberPhoto.startsWith('http') && (
                      <a href={item.memberPhoto} target="_blank" rel="noopener noreferrer" className="text-[11px] font-medium text-blue-600 hover:underline flex items-center gap-0.5">
                        원본 열람 <ExternalLink className="w-3 h-3" />
                      </a>
                    )}
                  </div>
                  <div className="relative aspect-[1.4/1] rounded-2xl bg-zinc-100 overflow-hidden border border-zinc-200 flex items-center justify-center">
                    {memberPhotoImg ? (
                      <img src={memberPhotoImg} alt="회원사진" className="w-full h-full object-contain" />
                    ) : (
                      <div className="text-xs text-zinc-400 font-medium">등록된 회원 사진이 없습니다.</div>
                    )}
                  </div>
                  <div className="bg-zinc-50 p-3 rounded-xl border border-zinc-200 text-xs space-y-1.5">
                    <div className="flex justify-between text-zinc-600"><span>신원인증</span><span className="font-bold text-blue-600">{item.identityAuth}</span></div>
                    <div className="flex justify-between text-zinc-600"><span>활동지역(GPS)</span><span className="font-mono text-zinc-800">{item.activeLocation}</span></div>
                  </div>
                </div>

              </div>

              <div className="bg-zinc-50 p-4 rounded-2xl border border-zinc-200 text-xs space-y-2">
                <div className="font-bold text-zinc-800 mb-1">추가 세부 정보 및 어업신고</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-zinc-600">
                  <div>• <b>카페 정보:</b> {item.cafeNickname} ({item.cafeId})</div>
                  <div>• <b>본인 연락처:</b> {item.phone}</div>
                  <div>• <b>가족 비상연락처:</b> {item.emergencyPhone}</div>
                  <div>• <b>어업신고유무:</b> {item.fisheryReport || '없음'}</div>
                </div>
                {item.fisheryDoc && item.fisheryDoc.startsWith('http') && (
                  <div className="pt-2 border-t border-zinc-200 flex items-center justify-between">
                    <span className="text-zinc-500">첨부된 어업신고증 증빙 서류:</span>
                    <a href={item.fisheryDoc} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline font-semibold flex items-center gap-1">
                      어업신고증 확인하기 <ExternalLink className="w-3 h-3" />
                    </a>
                  </div>
                )}
                {item.reviewerNote && (
                  <div className="pt-2 border-t border-zinc-200 text-zinc-500">
                    • <b>현재 심사 메모:</b> {item.reviewerNote}
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-4 border-t border-zinc-200 bg-white flex flex-col sm:flex-row items-center justify-between gap-3">
              <button 
                onClick={() => onUpdateStatus(item.rowNumber, 'RETAKE_REQUESTED', '서류 또는 사진 보완 요청')}
                className="px-4 py-2.5 rounded-xl border border-zinc-300 text-zinc-700 text-xs font-semibold hover:bg-zinc-50 transition"
              >
                재촬영 / 서류보완 요청
              </button>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => onUpdateStatus(item.rowNumber, 'REJECTED', '자격 요건 불일치')}
                  className="px-5 py-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold hover:bg-rose-100 transition flex items-center gap-1.5"
                >
                  <XCircle className="w-4 h-4" /> 반려
                </button>
                <button 
                  onClick={() => onUpdateStatus(item.rowNumber, 'APPROVED', '정상 검증 및 정회원 승인')}
                  className="px-6 py-2.5 rounded-xl bg-black text-white hover:bg-zinc-800 text-xs font-bold transition shadow-md flex items-center gap-1.5"
                >
                  <Check className="w-4 h-4" /> 최종 승인하기
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ChangePinModal({ onClose, onSubmit, oldPin, setOldPin, newPin, setNewPin, message }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white max-w-sm w-full p-6 rounded-2xl shadow-xl border border-zinc-200">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-bold text-base text-zinc-900">관리자 비밀번호 변경</h3>
              <button onClick={onClose} className="text-zinc-400 hover:text-zinc-600"><X className="w-4 h-4" /></button>
            </div>
            <form onSubmit={onSubmit} className="space-y-3">
              <div>
                <label className="text-xs font-semibold text-zinc-600 block mb-1">현재 비밀번호</label>
                <input
                  type="password"
                  value={oldPin}
                  onChange={(e) => setOldPin(e.target.value)}
                  className="w-full px-3 py-2 text-sm border rounded-xl bg-zinc-50 focus:outline-none focus:border-zinc-900"
                  required
                />
              </div>
              <div>
                <label className="text-xs font-semibold text-zinc-600 block mb-1">새 비밀번호 (4자리 이상)</label>
                <input
                  type="password"
                  value={newPin}
                  onChange={(e) => setNewPin(e.target.value)}
                  className="w-full px-3 py-2 text-sm border rounded-xl bg-zinc-50 focus:outline-none focus:border-zinc-900"
                  required
                />
              </div>
              {message.text && (
                <p className={`text-xs font-semibold ${message.isError ? 'text-rose-600' : 'text-emerald-600'}`}>
                  {message.text}
                </p>
              )}
              <div className="pt-2 flex justify-end gap-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-xs font-medium text-zinc-600 hover:bg-zinc-100 rounded-xl">취소</button>
                <button type="submit" className="px-4 py-2 text-xs font-bold bg-[#14428B] text-white rounded-xl shadow-xs">변경 저장</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
