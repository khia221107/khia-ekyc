<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KHIA 공식 회원 자격 인증 카드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
    }

    /* 1. 로열 샴페인 골드 테마 (승인 완료) */
    .theme-gold-master {
      background: linear-gradient(135deg, #1C1917 0%, #292524 45%, #1C1917 100%);
      border: 1.5px solid #EAB308;
      box-shadow: 0 20px 45px -15px rgba(234, 179, 8, 0.3), 0 0 20px rgba(234, 179, 8, 0.15);
    }
    .theme-gold-plate {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF08A 30%, #EAB308 70%, #CA8A04 100%);
      color: #713F12;
    }

    /* 2. 플래티넘 크롬 실버 테마 (심사 대기) */
    .theme-silver-master {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 45%, #0F172A 100%);
      border: 1.5px solid #94A3B8;
      box-shadow: 0 20px 45px -15px rgba(148, 163, 184, 0.3), 0 0 20px rgba(148, 163, 184, 0.12);
    }
    .theme-silver-plate {
      background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 35%, #CBD5E1 70%, #94A3B8 100%);
      color: #1E293B;
    }

    /* 3. 앤틱 코퍼 브론즈 테마 (반려 / 재촬영 요청) */
    .theme-bronze-master {
      background: linear-gradient(135deg, #1C0F0A 0%, #2A1710 45%, #1C0F0A 100%);
      border: 1.5px solid #D97706;
      box-shadow: 0 20px 45px -15px rgba(217, 119, 6, 0.3), 0 0 20px rgba(217, 119, 6, 0.12);
    }
    .theme-bronze-plate {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 30%, #FB923C 70%, #C2410C 100%);
      color: #7C2D12;
    }

    /* 메탈릭 브러시드 하이라이트 애니메이션 */
    .metallic-shimmer {
      background: linear-gradient(
        110deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.05) 35%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0.05) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% 100%;
      animation: shimmerSweep 7s infinite linear;
    }
    @keyframes shimmerSweep {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="bg-[#090D14] text-slate-100 antialiased selection:bg-amber-500 selection:text-black min-h-screen flex flex-col justify-between">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚠️ 배포된 Google Apps Script Web App URL(exec)을 대입하세요.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdMV7VGHUks7g3AQS_HPfc5mq43t3fdTrJWRbGsuIzRLq7NAcChDiHfCNv15R9CjOA/exec
";

    const IconWrapper = ({ children, className = "w-4 h-4", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const ShieldCheck = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
    const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconWrapper>;
    const Copy = (p) => <IconWrapper {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconWrapper>;
    const Check = (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12"/></IconWrapper>;
    const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
    const Phone = (p) => <IconWrapper {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;
    const Award = (p) => <IconWrapper {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconWrapper>;
    const Anchor = (p) => <IconWrapper {...p}><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></IconWrapper>;
    const Key = (p) => <IconWrapper {...p}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconWrapper>;
    const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
    const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
    const Unlock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></IconWrapper>;
    const X = (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
    const ZoomIn = (p) => (
      <IconWrapper {...p}>
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </IconWrapper>
    );

    function App() {
      const [member, setMember] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [copied, setCopied] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);

      // 2차 인증 상태
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [birthInput, setBirthInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [isUnmasked, setIsUnmasked] = useState(false);
      const [unmaskedBirth, setUnmaskedBirth] = useState('');
      const [unmaskedPhone, setUnmaskedPhone] = useState('');
      const [unmaskedEmerg, setUnmaskedEmerg] = useState('');

      // 이미지 확대(라이트박스 모달)
      const [previewImage, setPreviewImage] = useState(null);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetCode = urlParams.get('code');

        if (!targetCode) {
          setErrorMsg('조회할 회원 식별 코드가 URL에 포함되어 있지 않습니다.');
          setIsLoading(false);
          return;
        }

        fetch(`${GAS_API_URL}?code=${encodeURIComponent(targetCode)}`)
          .then(res => res.json())
          .then(res => {
            setIsLoading(false);
            if (res.success) {
              setMember(res.data);
            } else {
              setErrorMsg(res.message);
            }
          })
          .catch(err => {
            setIsLoading(false);
            setErrorMsg('서버 통신 실패: ' + err.message);
          });
      }, []);

      const copyOfficialCardUrl = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        });
      };

      const copyMemberCode = () => {
        if (!member?.code) return;
        navigator.clipboard.writeText(member.code).then(() => {
          setCodeCopied(true);
          setTimeout(() => setCodeCopied(false), 2000);
        });
      };

      const handleSecondaryAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!birthInput || birthInput.length < 6) {
          setAuthError('생년월일 6자리를 모두 입력해 주세요.');
          return;
        }

        try {
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'verifySecondaryAuth',
              code: member.code,
              birth: birthInput
            })
          });
          const res = await response.json();

          if (res.success) {
            setIsUnmasked(true);
            setUnmaskedBirth(res.unmaskedBirth);
            setUnmaskedPhone(res.unmaskedPhone);
            setUnmaskedEmerg(res.unmaskedEmergencyPhone);
            setIsAuthModalOpen(false);
          } else {
            setAuthError(res.message || '인증 정보가 일치하지 않습니다.');
          }
        } catch (err) {
          setAuthError('통신 오류: ' + err.message);
        }
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#090D14]">
            <div className="w-12 h-12 border-3 border-amber-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-sm font-bold text-amber-300 tracking-tight">공식 회원 자격 인증서 로드 중...</p>
            <p className="text-xs text-slate-400 mt-1">비공개 암호화 데이터 스트림을 복호화하고 있습니다.</p>
          </div>
        );
      }

      if (errorMsg || !member) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#090D14]">
            <div className="w-16 h-16 bg-rose-500/10 text-rose-400 rounded-3xl flex items-center justify-center mb-4 border border-rose-500/20">
              <XCircle className="w-8 h-8" />
            </div>
            <h2 className="text-lg font-bold text-white mb-1">인증 정보 확인 불가</h2>
            <p className="text-xs text-slate-400 max-w-xs mb-6">{errorMsg || '회원 정보를 찾을 수 없습니다.'}</p>
          </div>
        );
      }

      const isApproved = member.status === 'APPROVED';
      const isRejected = member.status === 'REJECTED' || member.status === 'RETAKE_REQUESTED';
      
      const themeMasterClass = isApproved ? 'theme-gold-master' : isRejected ? 'theme-bronze-master' : 'theme-silver-master';
      const themePlateClass = isApproved ? 'theme-gold-plate' : isRejected ? 'theme-bronze-plate' : 'theme-silver-plate';
      const themeLabelText = isApproved ? 'GOLD TIER VERIFIED' : isRejected ? 'BRONZE TIER (RECHECK)' : 'PLATINUM TIER PENDING';
      const displayIssueDate = isApproved ? (member.issueDate || '승인 완료') : '승인 대기';
      const currentBirthDisplay = isUnmasked ? unmaskedBirth : member.birth;

      // 🌟 [통합 메탈릭 디자인 시스템 매핑] 
      // 모든 하위 카드가 최상단 마스터 메탈릭 등급과 완벽하게 톤앤매너를 일치시킵니다.
      const theme = isApproved ? {
        cardBg: 'bg-gradient-to-br from-[#1A1612]/95 via-[#120F0C]/95 to-[#1A1612]/95 backdrop-blur-xl',
        cardBorder: 'border border-amber-500/30 hover:border-amber-400/50 shadow-[0_8px_30px_rgb(0,0,0,0.5)] shadow-amber-950/20',
        innerBox: 'bg-[#14100B]/90 border border-amber-500/20 shadow-inner',
        headerIcon: 'bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 shadow-md shadow-amber-500/20',
        accentBadge: 'bg-amber-400/10 text-amber-300 border border-amber-400/30',
        textHighlight: 'text-amber-300',
        divider: 'border-amber-500/20',
        buttonAction: 'bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-400/40',
        footerGlow: 'text-amber-400/80'
      } : isRejected ? {
        cardBg: 'bg-gradient-to-br from-[#1E110A]/95 via-[#140B07]/95 to-[#1E110A]/95 backdrop-blur-xl',
        cardBorder: 'border border-amber-700/40 hover:border-amber-600/60 shadow-[0_8px_30px_rgb(0,0,0,0.5)] shadow-orange-950/20',
        innerBox: 'bg-[#150A05]/90 border border-amber-700/25 shadow-inner',
        headerIcon: 'bg-gradient-to-br from-orange-400 to-amber-600 text-slate-950 shadow-md shadow-orange-500/20',
        accentBadge: 'bg-orange-500/10 text-orange-300 border border-orange-500/30',
        textHighlight: 'text-orange-400',
        divider: 'border-amber-700/20',
        buttonAction: 'bg-orange-500/15 hover:bg-orange-500/25 text-orange-300 border border-orange-400/40',
        footerGlow: 'text-orange-400/80'
      } : {
        cardBg: 'bg-gradient-to-br from-[#111927]/95 via-[#0B101D]/95 to-[#111927]/95 backdrop-blur-xl',
        cardBorder: 'border border-slate-500/30 hover:border-slate-400/50 shadow-[0_8px_30px_rgb(0,0,0,0.5)] shadow-slate-950/20',
        innerBox: 'bg-[#0E1524]/90 border border-slate-600/25 shadow-inner',
        headerIcon: 'bg-gradient-to-br from-slate-200 to-slate-400 text-slate-950 shadow-md shadow-slate-400/20',
        accentBadge: 'bg-slate-400/10 text-slate-200 border border-slate-400/30',
        textHighlight: 'text-slate-200',
        divider: 'border-slate-700/40',
        buttonAction: 'bg-slate-500/15 hover:bg-slate-500/25 text-slate-200 border border-slate-400/40',
        footerGlow: 'text-slate-400/80'
      };

      const splitBadges = (str) => {
        if (!str || str.trim() === '') return [];
        return str.split(',').map(s => s.trim()).filter(Boolean);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#111A2E] via-[#090D14] to-[#04060A]">
          {/* 상단 글로벌 헤더 */}
          <header className="sticky top-0 z-40 bg-[#0A0E17]/85 backdrop-blur-md border-b border-white/10 px-4 sm:px-8 py-3.5">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#14428B] to-[#0a234c] flex items-center justify-center text-white shadow-lg shadow-blue-900/30 border border-blue-400/30">
                  <ShieldCheck className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-base tracking-tight text-white drop-shadow">KHIA eKYC Verification</span>
                    <span className="px-2 py-0.5 text-[10px] font-bold bg-blue-500/20 text-blue-300 rounded-full border border-blue-400/30">공무 확인용</span>
                  </div>
                  <p className="text-xs text-slate-400 hidden sm:block">사단법인 한국비어업인수산자원보호협회 공식 자격 확인 체계</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {!isUnmasked ? (
                  <button
                    onClick={() => { setAuthError(''); setBirthInput(''); setIsAuthModalOpen(true); }}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition ${theme.buttonAction}`}
                  >
                    <Lock className="w-3.5 h-3.5" />
                    <span>2차 인증</span>
                  </button>
                ) : (
                  <span className="flex items-center gap-1 px-3 py-2 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-xl border border-emerald-500/40 shadow-sm shadow-emerald-950/40">
                    <Unlock className="w-3.5 h-3.5" />
                    <span>인증 해제됨</span>
                  </span>
                )}

                <button
                  onClick={copyOfficialCardUrl}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-white text-xs font-bold transition shadow-xs active:scale-95 border border-white/20 shrink-0 backdrop-blur-sm"
                >
                  {copied ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5" />}
                  <span>{copied ? '복사됨' : '링크 복사'}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            
            {/* ========================================================
                [최상단] 마스터 메탈릭 VIP 자격 플레이트
               ======================================================== */}
            <div className={`relative rounded-[32px] p-6 sm:p-8 text-white overflow-hidden transition-all ${themeMasterClass}`}>
              <div className="absolute inset-0 metallic-shimmer pointer-events-none"></div>

              <div className="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/15">
                <div>
                  <div className="flex items-center gap-2 mb-1.5">
                    <span className={`px-2.5 py-0.5 rounded-md text-[10px] font-black tracking-widest uppercase shadow-md ${themePlateClass}`}>
                      {themeLabelText}
                    </span>
                    <span className="text-[11px] font-bold tracking-wider text-slate-300">
                      사단법인 한국비어업인수산자원보호협회
                    </span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-md">
                    공식 회원 자격 증명서
                  </h1>
                </div>
                <div className="self-start sm:self-auto">
                  <StatusBadge status={member.status} />
                </div>
              </div>

              <div className="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-6 pt-6">
                <div 
                  onClick={() => member.profileImg && setPreviewImage({ title: '공식 프로필 사진', src: member.profileImg })}
                  className="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden border-2 border-white/40 shadow-2xl bg-zinc-900 shrink-0 cursor-pointer group"
                  title="클릭하여 확대 보기"
                >
                  {member.profileImg ? (
                    <>
                      <img src={member.profileImg} alt={member.name} className="w-full h-full object-cover transition group-hover:scale-105" />
                      <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                        <ZoomIn className="w-5 h-5 text-white" />
                      </div>
                    </>
                  ) : (
                    <div className="w-full h-full flex items-center justify-center font-black text-xl text-white/40">KHIA</div>
                  )}
                </div>

                <div className="flex-1 min-w-0 space-y-2">
                  <div className="flex items-baseline gap-3">
                    <h2 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-sm">{member.name}</h2>
                    <span className="text-sm font-semibold text-slate-300 font-mono">
                      생년: {currentBirthDisplay}
                    </span>
                  </div>
                  
                  <div className="flex items-center gap-1.5 text-sm">
                    <span className="text-slate-400 font-semibold shrink-0">소속단체:</span>
                    <span className="font-bold text-slate-100">{member.organization || '사단법인 한국비어업인수산자원보호협회'}</span>
                  </div>
                  
                  <div className="flex flex-wrap items-center gap-2 pt-1">
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-black/50 border border-white/20 text-xs font-mono font-bold text-white shadow-inner">
                      <span>인증코드:</span>
                      <span className="text-amber-300 font-black tracking-wider">{member.code}</span>
                    </div>
                    <span className="px-3 py-1 rounded-xl bg-white/10 border border-white/20 text-xs font-bold text-emerald-300">
                      신원인증 {member.identityAuth}
                    </span>
                  </div>
                </div>
              </div>

              <div className="relative z-10 mt-6 pt-4 border-t border-white/15 flex items-center justify-between text-[11px] text-slate-300 font-mono">
                <span>발급일자: {displayIssueDate}</span>
                <span className="font-bold tracking-widest text-slate-200 uppercase">OFFICIAL VERIFIED MEMBER</span>
              </div>
            </div>

            {/* ========================================================
                [1순위] 야간 입수 안전 및 즉각 신원 대조 (메탈릭 일체화)
               ======================================================== */}
            <div className={`rounded-3xl p-6 sm:p-7 transition-all ${theme.cardBg} ${theme.cardBorder} space-y-6`}>
              <div className={`pb-3 border-b ${theme.divider} flex items-center justify-between`}>
                <div className="flex items-center gap-3">
                  <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold ${theme.headerIcon}`}>

                    onChange={(e) => setBirthInput(e.target.value.replace(/[^0-9]/g, ''))}
                    placeholder="생년월일 6자리 숫자 입력"
                    className={`w-full text-center tracking-widest text-lg font-bold px-4 py-3 rounded-xl focus:outline-none ${theme.innerBox}`}
                    autoFocus
                  />
                  {authError && <p className="text-xs font-semibold text-rose-400">{authError}</p>}
                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAuthModalOpen(false)}
                      className="flex-1 py-3 bg-white/10 hover:bg-white/15 text-xs font-bold rounded-xl text-slate-300 transition"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className={`flex-1 py-3 text-slate-950 text-xs font-bold rounded-xl shadow-md transition font-black ${theme.plateClass || 'bg-amber-400 hover:bg-amber-300'}`}
                    >
                      마스킹 해제
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-white/10 bg-[#06080E]/90 py-6 text-center text-xs text-slate-400 mt-12 backdrop-blur-md">
            <p className="font-semibold text-slate-300">사단법인 한국비어업인수산자원보호협회 (KHIA) eKYC 통합 관리 체계</p>
            <p className={`mt-1 text-[11px] font-mono ${theme.footerGlow}`}>본 증명서는 공무 확인 용도로 실시간 검증됩니다.</p>
          </footer>
        </div>
      );
    }

    function StatusBadge({ status }) {
      switch (status) {
        case 'APPROVED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-400/20 text-amber-300 border border-amber-400/40 backdrop-blur-md shadow-sm shadow-amber-950/40">
              <CheckCircle2 className="w-3.5 h-3.5" /> 승인 완료 (인증회원)
            </span>
          );
        case 'PENDING':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-400/20 text-slate-200 border border-slate-400/40 backdrop-blur-md">
              <Clock className="w-3.5 h-3.5" /> 심사 대기중
            </span>
          );
        case 'REJECTED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-400/40 backdrop-blur-md">
              <XCircle className="w-3.5 h-3.5" /> 반려됨 (보완요망)
            </span>
          );
        case 'RETAKE_REQUESTED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-orange-500/20 text-orange-300 border border-orange-400/40 backdrop-blur-md">
              재촬영 / 서류보완 요청
            </span>
          );
        default:
          return (
            <span className="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700">
              {status}
            </span>
          );
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
