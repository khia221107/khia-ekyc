<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인증회원 자격인증 신청서</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
    }

    .theme-gold-master {
      background: linear-gradient(135deg, #1C1917 0%, #292524 45%, #1C1917 100%);
      border: 1.5px solid #EAB308;
      box-shadow: 0 20px 45px -15px rgba(234, 179, 8, 0.35), 0 0 25px rgba(234, 179, 8, 0.15);
    }
    .theme-gold-plate {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF08A 30%, #EAB308 70%, #CA8A04 100%);
      color: #713F12;
    }

    .theme-silver-master {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 45%, #0F172A 100%);
      border: 1.5px solid #94A3B8;
      box-shadow: 0 20px 45px -15px rgba(148, 163, 184, 0.35), 0 0 25px rgba(148, 163, 184, 0.12);
    }
    .theme-silver-plate {
      background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 35%, #CBD5E1 70%, #94A3B8 100%);
      color: #1E293B;
    }

    .theme-bronze-master {
      background: linear-gradient(135deg, #1C0F0A 0%, #2A1710 45%, #1C0F0A 100%);
      border: 1.5px solid #D97706;
      box-shadow: 0 20px 45px -15px rgba(217, 119, 6, 0.35), 0 0 25px rgba(217, 119, 6, 0.12);
    }
    .theme-bronze-plate {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 30%, #FB923C 70%, #C2410C 100%);
      color: #7C2D12;
    }

    .metallic-shimmer {
      background: linear-gradient(
        110deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.05) 35%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.05) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% 100%;
      animation: shimmerSweep 7s infinite linear;
    }
    @keyframes shimmerSweep {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-[#14428B] selection:text-white min-h-screen flex flex-col justify-between">

  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;">
      <div style="width: 48px; height: 48px; border: 3px solid #14428B; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
      <p style="font-size: 15px; font-weight: 800; color: #14428B; letter-spacing: -0.025em;">공식 회원 자격 인증서 로드 중...</p>
      <p style="font-size: 12px; color: #64748B; margin-top: 6px;">잠시만 기다려 주세요.</p>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 배포된 Google Apps Script Web App URL(exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz8Axo8L3tKO8bgqQJZCVvBJRdlFqAjtupS4Q-kINPkCkqr7KIkrNsqiydLqoXYWh2J/exec";

    const IconWrapper = ({ children, className = "w-4 h-4", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const ShieldCheck = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
    const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconWrapper>;
    const Copy = (p) => <IconWrapper {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconWrapper>;
    const Check = (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12"/></IconWrapper>;
    const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
    const Phone = (p) => <IconWrapper {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;
    const Award = (p) => <IconWrapper {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconWrapper>;
    const Anchor = (p) => <IconWrapper {...p}><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></IconWrapper>;
    const Key = (p) => <IconWrapper {...p}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconWrapper>;
    const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
    const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
    const Unlock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></IconWrapper>;
    const X = (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
    const ZoomIn = (p) => (
      <IconWrapper {...p}>
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </IconWrapper>
    );

    function App() {
      const [member, setMember] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [copied, setCopied] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);

      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [birthInput, setBirthInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [isUnmasked, setIsUnmasked] = useState(false);
      const [unmaskedBirth, setUnmaskedBirth] = useState('');
      const [unmaskedPhone, setUnmaskedPhone] = useState('');
      const [unmaskedEmerg, setUnmaskedEmerg] = useState('');

      const [previewDoc, setPreviewDoc] = useState(null);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetCode = urlParams.get('code');

        if (!targetCode) {
          setErrorMsg('URL에 회원 코드가 없습니다. "?code=회원코드" 형식으로 접속해 주세요.');
          setIsLoading(false);
          return;
        }

        fetch(`${GAS_API_URL}?code=${encodeURIComponent(targetCode)}`)
          .then(res => res.json())
          .then(res => {
            setIsLoading(false);
            if (res.success) {
              setMember(res.data);
            } else {
              setErrorMsg(res.message || '회원 정보를 찾을 수 없습니다.');
            }
          })
          .catch(err => {
            setIsLoading(false);
            setErrorMsg('서버 통신 실패: ' + err.message);
          });
      }, []);

      const copyOfficialCardUrl = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        });
      };

      const copyMemberCode = () => {
        if (!member?.code) return;
        navigator.clipboard.writeText(member.code).then(() => {
          setCodeCopied(true);
          setTimeout(() => setCodeCopied(false), 2000);
        });
      };

      const handleSecondaryAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!birthInput || birthInput.length < 6) {
          setAuthError('생년월일 6자리를 모두 입력해 주세요.');
          return;
        }

        try {
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'verifySecondaryAuth',
              code: member.code,
              birth: birthInput
            })
          });
          const res = await response.json();

          if (res.success) {
            setIsUnmasked(true);
            setUnmaskedBirth(res.unmaskedBirth);
            setUnmaskedPhone(res.unmaskedPhone);
            setUnmaskedEmerg(res.unmaskedEmergencyPhone);
            setIsAuthModalOpen(false);
          } else {
            setAuthError(res.message || '인증 정보가 일치하지 않습니다.');
          }
        } catch (err) {
          setAuthError('통신 오류: ' + err.message);
        }
      };

      const formatDisplayPhone = (phoneStr, isMasked = false) => {
        if (!phoneStr || phoneStr === '-') return '-';
        let raw = String(phoneStr).trim();
        if (raw.includes('*')) {
          if (raw.startsWith('10-') || raw.startsWith('10*')) raw = '0' + raw;
          return raw;
        }
        let clean = raw.replace(/[^0-9]/g, '');
        if (clean.length === 10 && clean.startsWith('10')) clean = '0' + clean;

        if (isMasked) {
          if (clean.length === 11) return `${clean.substring(0, 3)}-****-${clean.substring(7)}`;
          if (clean.length === 10) return `${clean.substring(0, 3)}-***-${clean.substring(6)}`;
          return clean;
        } else {
          if (clean.length === 11) return `${clean.substring(0, 3)}-${clean.substring(3, 7)}-${clean.substring(7)}`;
          if (clean.length === 10) return `${clean.substring(0, 3)}-${clean.substring(3, 6)}-${clean.substring(6)}`;
          return clean;
        }
      };

      const getOrgBadgeStyle = (orgName) => {
        const clean = String(orgName).trim();
        if (clean.includes('한국비어업인수산자원보호협회')) return 'bg-sky-50 text-sky-800 border-sky-200';
        if (clean.includes('대한수중환경보호협회')) return 'bg-teal-50 text-teal-800 border-teal-200';
        if (clean.includes('한국스피어피싱협회')) return 'bg-rose-50 text-rose-800 border-rose-200';
        if (clean.includes('엘프다이브')) return 'bg-purple-50 text-purple-800 border-purple-200';
        return 'bg-slate-50 text-slate-800 border-slate-200';
      };

      const renderSubmissionDate = (dateStr) => {
        if (!dateStr || dateStr === '-') {
          return (
            <div className="flex flex-col text-xs font-mono">
              <span className="text-slate-500">제출일시</span>
              <span className="text-slate-800 font-medium">-</span>
            </div>
          );
        }
        if (dateStr.includes('GMT')) {
          const parts = dateStr.split('GMT');
          return (
            <div className="flex flex-col text-xs font-mono leading-relaxed">
              <div className="text-slate-900 font-bold">
                제출일시: <span className="font-normal text-slate-700">{parts[0].trim()}</span>
              </div>
              <div className="font-bold text-[#14428B] tracking-tight">
                GMT{parts[1]}
              </div>
            </div>
          );
        }
        return (
          <div className="text-xs font-mono">
            <span className="font-bold text-slate-900">제출일시: </span>
            <span className="text-slate-700">{dateStr}</span>
          </div>
        );
      };

      if (isLoading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#F8FAFC]">
            <div className="w-12 h-12 border-3 border-[#14428B] border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-sm font-bold text-[#14428B] tracking-tight">공식 회원 자격 인증서 로드 중...</p>
            <p className="text-xs text-slate-400 mt-1">비공개 암호화 데이터 스트림을 복호화하고 있습니다.</p>
          </div>
        );
      }

      if (errorMsg || !member) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#F8FAFC]">
            <div className="w-16 h-16 bg-rose-50 text-rose-600 rounded-3xl flex items-center justify-center mb-4 border border-rose-200 shadow-sm">
              <XCircle className="w-8 h-8" />
            </div>
            <h2 className="text-lg font-bold text-slate-900 mb-2">인증 정보 확인 불가</h2>
            <p className="text-xs text-slate-600 max-w-sm mb-6 leading-relaxed bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              {errorMsg || '회원 정보를 찾을 수 없습니다.'}
            </p>
            <button 
              onClick={() => window.location.reload()}
              className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold rounded-xl text-white transition shadow-sm"
            >
              새로고침
            </button>
          </div>
        );
      }

      const isApproved = member.status === 'APPROVED';
      const isRejected = member.status === 'REJECTED' || member.status === 'RETAKE_REQUESTED';
      
      const themeMasterClass = isApproved ? 'theme-gold-master' : isRejected ? 'theme-bronze-master' : 'theme-silver-master';
      const themePlateClass = isApproved ? 'theme-gold-plate' : isRejected ? 'theme-bronze-plate' : 'theme-silver-plate';
      const themeLabelText = isApproved ? '공식 자격 승인 완료' : isRejected ? '서류 보완 요청 중' : '자격 심사 진행 중';

      const displayIssueDate = isApproved ? (member.issueDate || '승인 완료') : '승인 대기';
      const currentBirthDisplay = isUnmasked ? unmaskedBirth : member.birth;
      const cleanAddress = (member.activeAddress || '').replace(/^대한민국\s*/, '');

      const currentPhoneDisplay = isUnmasked 
        ? formatDisplayPhone(unmaskedPhone, false) 
        : formatDisplayPhone(member.phone, true);

      const currentEmergDisplay = isUnmasked 
        ? formatDisplayPhone(unmaskedEmerg, false) 
        : formatDisplayPhone(member.emergencyPhone, true);

      const splitBadges = (str) => {
        if (!str || str.trim() === '' || str.includes('없음')) return [];
        return str.split(',').map(s => s.trim()).filter(Boolean);
      };

      const certDocItems = Array.isArray(member.certDocItems) ? member.certDocItems : [];
      const fisheryDocItems = Array.isArray(member.fisheryDocItems) ? member.fisheryDocItems : [];

      return (
        <div className="min-h-screen flex flex-col bg-[#F4F7FB]">
          
          {/* 상단 글로벌 헤더 */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#14428B] to-[#0A2A5E] flex items-center justify-center text-white shadow-md shadow-blue-900/20 shrink-0">
                  <ShieldCheck className="w-6 h-6" />
                </div>
                <div className="flex flex-col">
                  <span className="font-extrabold text-base tracking-tight text-slate-900 leading-tight">
                    KHIA eKYC Verification
                  </span>
                  <div className="mt-1">
                    <span className="inline-block px-2 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 rounded-md border border-blue-200">
                      공무 확인용
                    </span>
                  </div>
                </div>
              </div>

              <button
                onClick={copyOfficialCardUrl}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition shadow-xs active:scale-95 shrink-0"
              >
                {copied ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5" />}
                <span>{copied ? '복사됨' : '링크 복사'}</span>
              </button>
            </div>
          </header>

          {/* 메인 컨테이너 */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4 space-y-6">
            
            {/* [최상단] 마스터 메탈릭 VIP 자격 플레이트 */}
            <div className={`relative rounded-[32px] p-6 sm:p-8 text-white overflow-hidden transition-all ${themeMasterClass}`}>
              <div className="absolute inset-0 metallic-shimmer pointer-events-none"></div>

              <div className="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-white/15">
                <div className="space-y-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className={`px-2.5 py-0.5 rounded-md text-[10px] font-black tracking-wider shadow-md ${themePlateClass}`}>
                      {themeLabelText}
                    </span>
                  </div>
                  <div className="text-xs sm:text-sm font-bold tracking-wider text-slate-300">
                    사단법인 한국비어업인수산자원보호협회
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-md">
                    공식 회원 자격 인증서
                  </h1>
                </div>
                <div className="self-start sm:self-auto">
                  <StatusBadge status={member.status} />
                </div>
              </div>

              <div className="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-6 pt-6">
                <div 
                  onClick={() => member.profileImg && setPreviewDoc({ title: '프로필 패치', src: member.profileImg, isPdf: false })}
                  className="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden border-2 border-white/40 shadow-2xl bg-zinc-900 shrink-0 cursor-pointer group"
                >
                  {member.profileImg ? (
                    <>
                      <img src={member.profileImg} alt={member.name} className="w-full h-full object-cover transition group-hover:scale-105" />
                      <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                        <ZoomIn className="w-5 h-5 text-white" />
                      </div>
                    </>
                  ) : (
                    <div className="w-full h-full flex items-center justify-center font-black text-xl text-white/40">KHIA</div>
                  )}
                </div>

                <div className="flex-1 min-w-0 space-y-2">
                  <div className="flex items-baseline gap-3">
                    <h2 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-sm">{member.name}</h2>
                    <span className="text-sm font-semibold text-slate-300 font-mono">
                      생년: {currentBirthDisplay}
                    </span>
                  </div>
                  
                  <div className="flex items-center gap-1.5 text-sm">
                    <span className="text-slate-400 font-semibold shrink-0">소속단체:</span>
                    <span className="font-bold text-slate-100">{member.organization || '사단법인 한국비어업인수산자원보호협회'}</span>
                  </div>
                  
                  <div className="flex flex-wrap items-center gap-2 pt-1">
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-black/50 border border-white/20 text-xs font-mono font-bold text-white shadow-inner">
                      <span className="text-amber-300 font-bold">인증코드:</span>
                      <span className="text-amber-300 font-black tracking-wider">{member.code}</span>
                    </div>
                    <span className="px-3 py-1 rounded-xl bg-white/10 border border-white/20 text-xs font-bold text-emerald-300">
                      신원인증 {member.identityAuth}
                    </span>
                  </div>
                </div>
              </div>

              <div className="relative z-10 mt-6 pt-4 border-t border-white/15 font-mono">
                <div className="text-[10px] text-slate-400 font-medium tracking-tight">발급일자</div>
                <div className="flex items-center justify-between mt-0.5 text-[11px]">
                  <span className="text-amber-300 font-black tracking-wider">
                    {displayIssueDate}
                  </span>
                  <span className="font-bold tracking-widest text-amber-300 uppercase">
                    OFFICIAL VERIFIED MEMBER
                  </span>
                </div>
              </div>
            </div>

            {/* [1순위] 안전관리요원 자격 증명 */}

                  </button>
                </div>
                <div className="p-4 sm:p-6 w-full flex items-center justify-center overflow-auto max-h-[80vh] bg-slate-100/60">
                  {previewDoc.isPdf ? (
                    <iframe src={previewDoc.src} className="w-full h-[75vh] rounded-xl border border-slate-200 bg-white" title={previewDoc.title} />
                  ) : (
                    <img 
                      src={previewDoc.src} 
                      alt={previewDoc.title} 
                      className="max-h-[75vh] w-auto max-w-full object-contain rounded-xl shadow-lg border border-slate-200 bg-white"
                    />
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 2차 인증 모달 */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="max-w-sm w-full p-6 rounded-3xl shadow-2xl bg-white border border-slate-200 text-slate-900">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-800">
                      <Lock className="w-4 h-4" />
                    </div>
                    <h3 className="font-bold text-base text-slate-900">2차 인증</h3>
                  </div>
                  <button onClick={() => setIsAuthModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                  생년월일 및 비상 연락망의 마스킹을 해제하려면 회원의 <b>생년월일 6자리</b>(예: 850112)를 입력해 주세요.
                </p>
                <form onSubmit={handleSecondaryAuthSubmit} className="space-y-3">
                  <input
                    type="password"
                    maxLength="6"
                    value={birthInput}
                    onChange={(e) => setBirthInput(e.target.value.replace(/[^0-9]/g, ''))}
                    placeholder="생년월일 6자리 숫자 입력"
                    className="w-full text-center tracking-widest text-lg font-bold px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#14428B] bg-slate-50 text-slate-900"
                    autoFocus
                  />
                  {authError && <p className="text-xs font-semibold text-rose-600">{authError}</p>}
                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAuthModalOpen(false)}
                      className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-xs font-bold rounded-xl text-slate-700 transition"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 bg-[#14428B] hover:bg-[#0D2E63] text-white text-xs font-bold rounded-xl shadow-md transition"
                    >
                      마스킹 해제
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 하단 푸터 */}
          <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 mt-4 shadow-2xs">
            <p className="font-semibold text-slate-700">사단법인 한국비어업인수산자원보호협회 (KHIA) eKYC 통합 관리 체계</p>
            <p className="mt-1 text-[11px] font-mono text-slate-400">본 증명서는 공무 확인 용도로 실시간 검증됩니다.</p>
          </footer>
        </div>
      );
    }

    function StatusBadge({ status }) {
      switch (status) {
        case 'APPROVED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-400/20 text-amber-300 border border-amber-400/40 backdrop-blur-md shadow-xs">
              <CheckCircle2 className="w-3.5 h-3.5" /> 승인 완료 (인증회원)
            </span>
          );
        case 'PENDING':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-400/20 text-slate-200 border border-slate-400/40 backdrop-blur-md shadow-xs">
              <Clock className="w-3.5 h-3.5" /> 심사 대기중
            </span>
          );
        case 'REJECTED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-400/30 backdrop-blur-md shadow-xs">
              <XCircle className="w-3.5 h-3.5" /> 반려됨 (보완요망)
            </span>
          );
        case 'RETAKE_REQUESTED':
          return (
            <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-orange-500/20 text-orange-300 border border-orange-400/30 backdrop-blur-md shadow-xs">
              재촬영 / 서류보완 요청
            </span>
          );
        default:
          return (
            <span className="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700">
              {status}
            </span>
          );
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
