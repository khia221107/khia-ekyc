<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>등록 회원 신원·자격 조회</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <!-- 웹폰트 고속 사전 연결 및 안정적인 CDN 로드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet" />

  <style>
    body, #root { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif !important; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-mono, [class*="font-mono"] {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace !important;
    }

    .font-handwriting {
      font-family: 'Nanum Pen Script', cursive !important;
    }

    /* 💡 눈에 피로감이 없는 부드러운 텍스트 반짝임(숨쉬기) 애니메이션 */
    @keyframes softTextPulse {
      0%, 100% {
        opacity: 1;
        color: #14428B;
      }
      50% {
        opacity: 0.35;
        color: #2563EB;
      }
    }
    .loading-text-shimmer {
      animation: softTextPulse 2.2s ease-in-out infinite;
    }

    .theme-gold-master {
      background: linear-gradient(135deg, #1C1917 0%, #292524 45%, #1C1917 100%);
      border: 1.5px solid #EAB308;
      box-shadow: 0 20px 45px -15px rgba(234, 179, 8, 0.35), 0 0 25px rgba(234, 179, 8, 0.15);
    }
    .theme-gold-plate {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF08A 30%, #EAB308 70%, #CA8A04 100%);
      color: #713F12;
    }

    .theme-silver-master {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 45%, #0F172A 100%);
      border: 1.5px solid #94A3B8;
      box-shadow: 0 20px 45px -15px rgba(148, 163, 184, 0.35), 0 0 25px rgba(148, 163, 184, 0.12);
    }
    .theme-silver-plate {
      background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 35%, #CBD5E1 70%, #94A3B8 100%);
      color: #1E293B;
    }

    .theme-bronze-master {
      background: linear-gradient(135deg, #1C0F0A 0%, #2A1710 45%, #1C0F0A 100%);
      border: 1.5px solid #D97706;
      box-shadow: 0 20px 45px -15px rgba(217, 119, 6, 0.35), 0 0 25px rgba(217, 119, 6, 0.12);
    }
    .theme-bronze-plate {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 30%, #FB923C 70%, #C2410C 100%);
      color: #7C2D12;
    }

    .metallic-shimmer {
      background: linear-gradient(
        110deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.05) 35%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.05) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% 100%;
      animation: shimmerSweep 7s infinite linear;
    }
    @keyframes shimmerSweep {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-[#14428B] selection:text-white min-h-screen flex flex-col justify-between">

  <!-- 초기 브라우저 로딩 화면: 상단 스피너 제거 & 텍스트만 부드럽게 반짝임 -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background-color: #F8FAFC;">
      <p class="loading-text-shimmer" style="font-size: 19px; font-weight: 800; color: #14428B; letter-spacing: -0.025em; margin: 0;">등록 인증서 로드 중...</p>
      <p style="font-size: 14px; color: #64748B; margin-top: 8px; margin-bottom: 0;">비공개 암호화 데이터 스트림을 복호화하고 있습니다.</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 배포된 Google Apps Script Web App URL(exec) 유지
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzodwjN_GXrxC5SBdx9RKes9Rd60ynf_qLoirGb6t08kpGUFHSFWpJUhcbFSTC9Oro/exec";

    const IconWrapper = ({ children, className = "w-4 h-4", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const NetIcon = ({ className = "w-4 h-4", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        <path d="M3 5c6 2 12 2 18 0" />
        <path d="M4 5v12c0 2 3.5 3 8 3s8-1 8-3V5" />
        <path d="M4 10l16 6" />
        <path d="M20 10L4 16" />
        <path d="M8 6l12 6" />
        <path d="M16 6L4 12" />
        <circle cx="5" cy="4" r="1" fill="currentColor" />
        <circle cx="12" cy="5.5" r="1" fill="currentColor" />
        <circle cx="19" cy="4" r="1" fill="currentColor" />
      </svg>
    );

    const HoeIcon = ({ className = "w-3.5 h-3.5", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        <path d="M14 3c-4.5 0-8.5 3-9.5 7.5 3.5 1 7.5-.5 9.5-3.5 1-1.5 1-3 0-4Z" fill="currentColor" fillOpacity="0.18" />
        <path d="M14 7l3 3" />
        <path d="M17 10l-7 10" strokeWidth="2.5" />
      </svg>
    );

    const DivingMaskIcon = ({ className = "w-3.5 h-3.5", ...props }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        <path d="M3 8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-2.5l-1.5-2-1.5 2H6a3 3 0 0 1-3-3V8Z" fill="currentColor" fillOpacity="0.15" />
        <path d="M21 4v11a4 4 0 0 1-4 4h-2" />
      </svg>
    );

    const ShieldCheck = (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
    const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
    const XCircle = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconWrapper>;
    const Copy = (p) => <IconWrapper {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconWrapper>;
    const Check = (p) => <IconWrapper {...p}><polyline points="20 6 9 17 4 12"/></IconWrapper>;
    const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
    const Phone = (p) => <IconWrapper {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconWrapper>;
    const Award = (p) => <IconWrapper {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></IconWrapper>;
    const Key = (p) => <IconWrapper {...p}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconWrapper>;
    const Zap = (p) => <IconWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
    const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>;
    const ZoomIn = (p) => (
      <IconWrapper {...p}>
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </IconWrapper>
    );

    function App() {
      const [member, setMember] = useState(null);
      const [isLoading, setIsLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [copied, setCopied] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);
      const [logoLoadError, setLogoLoadError] = useState(false);

      // 진입 시 생년월일 6자리 인증 및 3회 누적 실패 시 코드 자동 삭제 상태
      const [urlCode, setUrlCode] = useState('');
      const [clientIp, setClientIp] = useState('감지중');
      const [isEntryVerified, setIsEntryVerified] = useState(false);
      const [entryBirthInput, setEntryBirthInput] = useState('');
      const [entryError, setEntryError] = useState('');
      const [isVerifyingEntry, setIsVerifyingEntry] = useState(false);
      const [failCount, setFailCount] = useState(0);
      const [isCodeDeleted, setIsCodeDeleted] = useState(false);

      const [previewDoc, setPreviewDoc] = useState(null);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetCode = (urlParams.get('code') || '').trim();
        setUrlCode(targetCode);

        // 접속자 공인 IP 감지 (관리자 로그 기록용)
        fetch('https://api.ipify.org?format=json')
          .then(r => r.json())
          .then(d => { if (d && d.ip) setClientIp(d.ip); })
          .catch(() => {
            fetch('https://get.geojs.io/v1/ip.json')
              .then(r2 => r2.json())
              .then(d2 => { if (d2 && d2.ip) setClientIp(d2.ip); })
              .catch(() => setClientIp('IP 미감지'));
          });

        if (!targetCode) {
          setErrorMsg('URL에 회원 코드가 없습니다. "?code=회원코드" 형식으로 접속해 주세요.');
          setIsLoading(false);
          return;
        }

        const localFails = parseInt(localStorage.getItem(`KHIA_FAIL_${targetCode}`) || '0', 10);
        if (localFails > 0) setFailCount(localFails);
        if (localFails >= 3) setIsCodeDeleted(true);

        fetch(`${GAS_API_URL}?code=${encodeURIComponent(targetCode)}`)
          .then(res => res.json())
          .then(res => {
            setIsLoading(false);
            if (res.isDeleted) {
              setIsCodeDeleted(true);
              setErrorMsg(res.message || '생년월일 입력 3회 누적 실패로 고유 코드가 자동 삭제되어 접속이 불가합니다.');
              return;
            }
            if (typeof res.failCount === 'number') {
              setFailCount(res.failCount);
              localStorage.setItem(`KHIA_FAIL_${targetCode}`, String(res.failCount));
              if (res.failCount >= 3) setIsCodeDeleted(true);
            }
            if (!res.success && !res.requireBirthAuth) {
              setErrorMsg(res.message || '회원 정보를 찾을 수 없습니다.');
            }
          })
          .catch(err => {
            setIsLoading(false);
            setErrorMsg('서버 통신 실패: ' + err.message);
          });
      }, []);

      // 생년월일 6자리 입력 후 인증서 열람 요청
      const handleEntryGateSubmit = async (e) => {
        e.preventDefault();
        setEntryError('');

        if (!entryBirthInput || entryBirthInput.length < 6) {
          setEntryError('생년월일 6자리(숫자)를 정확히 입력해 주세요.');
          return;
        }

        setIsVerifyingEntry(true);
        try {
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'verifySecondaryAuth',
              code: urlCode,
              birth: entryBirthInput,
              clientIp: clientIp,
              userAgent: navigator.userAgent
            })
          });
          const res = await response.json();
          setIsVerifyingEntry(false);

          if (res.success && res.data) {
            setMember(res.data);
            setIsEntryVerified(true);
          } else {
            const nextFails = typeof res.failCount === 'number' ? res.failCount : (failCount + 1);
            localStorage.setItem(`KHIA_FAIL_${urlCode}`, String(nextFails));
            setFailCount(nextFails);

            if (res.isDeleted || nextFails >= 3) {
              setIsCodeDeleted(true);
            } else {
              setEntryError(`생년월일이 일치하지 않습니다. (누적 실패: ${nextFails}회 / 3회 실패 시 코드 자동 삭제)`);
              setEntryBirthInput('');
            }
          }
        } catch (err) {
          setIsVerifyingEntry(false);
          setEntryError('서버 통신 오류: ' + err.message);
        }
      };

      const copyOfficialCardUrl = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        });
      };

      const copyMemberCode = () => {
        if (!member?.code) return;
        navigator.clipboard.writeText(member.code).then(() => {
          setCodeCopied(true);
          setTimeout(() => setCodeCopied(false), 2000);
        });
      };

      const formatDisplayPhone = (phoneStr) => {
        if (!phoneStr || phoneStr === '-') return '-';
        let clean = String(phoneStr).replace(/[^0-9]/g, '');
        if (clean.length === 10 && clean.startsWith('10')) clean = '0' + clean;
        if (clean.length === 11) return `${clean.substring(0, 3)}-${clean.substring(3, 7)}-${clean.substring(7)}`;
        if (clean.length === 10) return `${clean.substring(0, 3)}-${clean.substring(3, 6)}-${clean.substring(6)}`;
        return String(phoneStr).trim();
      };

      const getOrgBadgeStyle = (orgName) => {
        const clean = String(orgName).trim();
        if (clean.includes('한국비어업인수산자원보호협회')) return 'bg-sky-50 text-sky-800 border-sky-200';
        if (clean.includes('대한수중환경보호협회')) return 'bg-teal-50 text-teal-800 border-teal-200';
        if (clean.includes('한국스피어피싱협회')) return 'bg-rose-50 text-rose-800 border-rose-200';
        if (clean.includes('엘프다이브')) return 'bg-purple-50 text-purple-800 border-purple-200';
        return 'bg-slate-50 text-slate-800 border-slate-200';
      };

      const getSafetyEduBadgeStyle = (eduName) => {
        const clean = String(eduName).trim();
        if (clean.includes('일반형')) return 'bg-sky-50 text-sky-800 border-sky-200';
        if (clean.includes('수상형')) return 'bg-cyan-50 text-cyan-800 border-cyan-200';
        if (clean.includes('수중형')) return 'bg-indigo-50 text-indigo-800 border-indigo-200';
        if (clean.includes('통합형')) return 'bg-emerald-50 text-emerald-800 border-emerald-200';
        return 'bg-blue-50 text-blue-800 border-blue-200';
      };

      const getQualificationBadgeStyle = (index) => {
        const palette = [
          'bg-purple-50 text-purple-800 border-purple-200',
          'bg-rose-50 text-rose-800 border-rose-200',
          'bg-amber-50 text-amber-800 border-amber-200',
          'bg-teal-50 text-teal-800 border-teal-200',
          'bg-fuchsia-50 text-fuchsia-800 border-fuchsia-200'
        ];
        return palette[Math.max(0, index) % palette.length];
      };

      const renderFisheryItemIcon = (labelStr) => {
        const clean = String(labelStr || '').trim();
        if (clean.includes('맨손')) return <HoeIcon className="w-4 h-4 text-amber-700 shrink-0" />;
        if (clean.includes('나잠')) return <DivingMaskIcon className="w-4 h-4 text-cyan-700 shrink-0" />;
        return <NetIcon className="w-4 h-4 text-cyan-700 shrink-0" />;
      };

      const renderStatusIcon = (status) => {
        if (status === 'APPROVED') return <CheckCircle2 className="w-3.5 h-3.5 shrink-0" />;
        if (status === 'REJECTED' || status === 'RETAKE_REQUESTED') return <XCircle className="w-3.5 h-3.5 shrink-0" />;
        return <Clock className="w-3.5 h-3.5 shrink-0" />;
      };

      const renderIssueDateFormatted = (dateStr, isApprovedStatus) => {
        if (!isApprovedStatus || !dateStr || dateStr === '승인 대기') {
          return (
            <div className="inline-flex items-center gap-1 text-amber-300 font-bold text-xs leading-tight">
              <span>승인</span>
              <span>대기</span>
            </div>
          );
        }

        const match = String(dateStr).trim().match(/^(\d{4}년)\s*(\d{1,2}월)\s*(\d{1,2}일)$/);
        if (match) {
          return (
            <div className="flex flex-col items-start text-amber-300 font-bold text-xs leading-tight space-y-0.5">
              <span>{match[1]}</span>
              <div className="inline-flex items-center gap-1 text-xs">
                <span>{match[2]}</span>
                <span>{match[3]}</span>
              </div>
            </div>
          );
        }

        return <span className="text-amber-300 font-bold text-xs">{dateStr}</span>;
      };

      const renderSubmissionDate = (dateStr) => {
        if (!dateStr || dateStr === '-') {
          return (
            <div className="flex flex-col text-xs font-mono">
              <span className="text-slate-500">제출일시</span>
              <span className="text-slate-800 font-medium">-</span>
            </div>
          );
        }
        if (dateStr.includes('GMT')) {
          const parts = dateStr.split('GMT');
          return (
            <div className="flex flex-col text-xs font-mono leading-relaxed">
              <div className="text-slate-900 font-bold">
                제출일시: <span className="font-normal text-slate-700">{parts[0].trim()}</span>
              </div>
              <div className="font-bold text-[#14428B] tracking-tight">
                GMT{parts[1]}
              </div>
            </div>
          );
        }
        return (
          <div className="text-xs font-mono">
            <span className="font-bold text-slate-900">제출일시: </span>
            <span className="text-slate-700">{dateStr}</span>
          </div>
        );
      };

      // ========================================================
      // [1] 로딩 화면: 상단 스피너 없이 텍스트만 부드럽게 반짝임
      // ========================================================
      if (isLoading || isVerifyingEntry) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '24px', backgroundColor: '#F8FAFC' }}>
            <p className="loading-text-shimmer" style={{ fontSize: '19px', fontWeight: 800, color: '#14428B', letterSpacing: '-0.025em', margin: 0 }}>
              등록 인증서 로드 중...
            </p>
            <p style={{ fontSize: '14px', color: '#64748B', marginTop: '8px', marginBottom: 0 }}>
              비공개 암호화 데이터 스트림을 복호화하고 있습니다.
            </p>
          </div>
        );
      }

      // ========================================================
      // [2] 3회 누적 실패 시 고유 코드 자동 삭제 및 재발급 안내 화면
      // ========================================================
      if (isCodeDeleted) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#F8FAFC]">
            <div className="max-w-md w-full bg-white p-7 rounded-3xl border border-rose-200 shadow-xl space-y-5">
              <div className="w-16 h-16 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto border border-rose-200 shadow-xs">
                <XCircle className="w-8 h-8" />
              </div>

              <div className="space-y-2">
                <span className="inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-800 text-[11px] font-black tracking-wide">
                  보안 프로토콜 작동 · 고유 코드 영구 말소
                </span>
                <h2 className="text-lg sm:text-xl font-black text-slate-900">
                  고유 코드 자동 삭제 및 접속 불가
                </h2>
              </div>

              <div className="p-4 rounded-2xl bg-rose-50/70 border border-rose-200 text-left space-y-2 text-xs text-rose-900 leading-relaxed">
                <p className="font-bold">
                  • 생년월일 입력 3회 실패(시간 무관 누적)로 인해 해당 고유 코드가 자동 삭제되어 접속이 불가합니다.
                </p>
                <p className="font-semibold text-rose-700">
                  • 접속 불가 시 협회를 통해 <b>회원 고유 코드를 재발급</b> 받아야 합니다.
                </p>
              </div>

              <div className="pt-1">
                <a
                  href="https://cafe.naver.com/khia230712"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="block w-full py-3.5 bg-[#14428B] hover:bg-[#0D2E63] text-white text-xs font-bold rounded-xl transition shadow-md"
                >
                  협회 공식 카페에서 고유 코드 재발급 문의하기
                </a>
              </div>
            </div>
          </div>
        );
      }

      if (errorMsg) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#F8FAFC]">
            <div className="w-16 h-16 bg-rose-50 text-rose-600 rounded-3xl flex items-center justify-center mb-4 border border-rose-200 shadow-sm">
              <XCircle className="w-8 h-8" />
            </div>
            <h2 className="text-lg font-bold text-slate-900 mb-2">인증 정보 확인 불가</h2>
            <p className="text-xs text-slate-600 max-w-sm mb-6 leading-relaxed bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              {errorMsg}
            </p>
            <button 
              onClick={() => window.location.reload()}
              className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold rounded-xl text-white transition shadow-sm"
            >
              새로고침
            </button>
          </div>
        );
      }

      // ========================================================
      // [3] 진입 시 생년월일(숫자 6자리) 입력 게이트
      // ========================================================
      if (!isEntryVerified || !member) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#F4F7FB]">
            <div className="max-w-md w-full bg-white p-7 rounded-3xl shadow-2xl border border-slate-200 space-y-5">
              
              <div className="flex items-center gap-3 pb-4 border-b border-slate-100">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#14428B] to-[#0A2A5E] flex items-center justify-center text-white shadow-md shrink-0">
                  <Lock className="w-5 h-5 text-amber-300" />
                </div>
                <div className="text-left">
                  <span className="text-[11px] font-bold text-[#14428B] block">KHIA eKYC Security Gate</span>
                  <h2 className="text-base sm:text-lg font-black text-slate-900 leading-tight">
                    회원 인증서 열람 본인 확인
                  </h2>
                </div>
              </div>

              <div className="space-y-3 text-left">
                <p className="text-xs text-slate-600 leading-relaxed">
                  회원 인증서를 열람하려면 회원의 <b>생년월일(숫자 6자리)</b>을 입력해 주세요. 인증 후 모든 정보가 공개됩니다.
                </p>

                <div className="p-4 rounded-2xl bg-amber-50/90 border border-amber-200 text-xs text-amber-950 space-y-1.5 leading-relaxed">
                  <p className="font-extrabold text-rose-600">
                    ⚠️ 보안 주의 안내
                  </p>
                  <p className="font-bold">
                    입력 3회 실패 시(시간 무관 누적하여), 고유 코드가 자동 삭제되어 접속 불가해 집니다.
                  </p>
                  <p className="text-[11px] text-amber-800 font-semibold">
                    * 접속 불가 시 회원 고유 코드를 재발급 받아야 합니다.
                  </p>
                </div>

                {failCount > 0 && (
                  <div className="px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-xs font-bold text-rose-600 text-center">
                    현재 누적 입력 실패: {failCount}회 / 3회 (남은 기회: {Math.max(0, 3 - failCount)}회)
                  </div>
                )}
              </div>

              <form onSubmit={handleEntryGateSubmit} className="space-y-3">
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength="6"
                  value={entryBirthInput}
                  onChange={(e) => setEntryBirthInput(e.target.value.replace(/[^0-9]/g, ''))}
                  placeholder="생년월일 숫자 6자리 (예: 850112)"
                  className="w-full text-center tracking-widest text-lg font-bold px-4 py-3.5 rounded-xl border border-slate-300 focus:outline-none focus:border-[#14428B] bg-slate-50 text-slate-900"
                  autoFocus
                />

                {entryError && (
                  <p className="text-xs font-bold text-rose-600 text-center leading-relaxed">
                    {entryError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full py-3.5 bg-[#14428B] hover:bg-[#0D2E63] text-white text-sm font-black rounded-xl shadow-md transition active:scale-98"
                >
                  인증서 열람하기
                </button>
              </form>

              <p className="text-[11px] text-slate-400 text-center font-mono">
                식별 코드: {urlCode}
              </p>
            </div>
          </div>
        );
      }

      // ========================================================
      // [4] 생년월일 인증 완료 후: 모든 정보 마스킹 없이 전체 공개
      // ========================================================
      const isApproved = member.status === 'APPROVED';
      const isRejected = member.status === 'REJECTED' || member.status === 'RETAKE_REQUESTED';
      
      const themeMasterClass = isApproved ? 'theme-gold-master' : isRejected ? 'theme-bronze-master' : 'theme-silver-master';
      const themePlateClass = isApproved ? 'theme-gold-plate' : isRejected ? 'theme-bronze-plate' : 'theme-silver-plate';
      const themeLabelText = isApproved ? '공식 자격 승인 완료' : isRejected ? '서류 보완 요청 중' : '자격 심사 진행 중';

      const displayIssueDate = isApproved ? (member.issueDate || '승인 완료') : '승인 대기';
      const cleanAddress = (member.activeAddress || '').replace(/^대한민국\s*/, '');

      const fullPhoneDisplay = formatDisplayPhone(member.phone);
      const fullEmergDisplay = formatDisplayPhone(member.emergencyPhone);

      const splitBadges = (str) => {
        if (!str || str.trim() === '' || str.includes('없음')) return [];
        return str.split(',').map(s => s.trim()).filter(Boolean);
      };

      const orgBadgeList = splitBadges(member.organization || '사단법인 한국비어업인수산자원보호협회');
      const safetyList = splitBadges(member.safetyEdu);
      const qualList = splitBadges(member.qualifications);
      const certDocItems = Array.isArray(member.certDocItems) ? member.certDocItems : [];
      const fisheryDocItems = Array.isArray(member.fisheryDocItems) ? member.fisheryDocItems : [];

      return (
        <div className="min-h-screen flex flex-col bg-[#F4F7FB]">
          
          {/* 상단 글로벌 헤더 */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#14428B] to-[#0A2A5E] flex items-center justify-center text-white shadow-md shadow-blue-900/20 overflow-hidden border border-blue-200 shrink-0">
                  {!logoLoadError ? (
                    <img
                      src="logo.png"
                      alt="KHIA 로고"
                      className="w-full h-full object-cover"
                      onError={() => setLogoLoadError(true)}
                    />
                  ) : (
                    <svg viewBox="0 0 48 48" fill="none" className="w-7 h-7 text-amber-300">
                      <circle cx="24" cy="12" r="5" stroke="currentColor" strokeWidth="2.5"/>
                      <line x1="24" y1="17" x2="24" y2="40" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                      <path d="M12 28h-3a15 15 0 0 0 30 0h-3" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                      <path d="M10 20c-2 4-2 10 2 15M38 20c2 4 2 10-2 15" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                    </svg>
                  )}
                </div>
                <div className="flex flex-col">
                  <span className="font-extrabold text-base tracking-tight text-slate-900 leading-tight">
                    KHIA eKYC Verification
                  </span>
                  <span className="text-xs font-semibold text-slate-400 mt-0.5 tracking-tight">
                    사단법인 한국비어업인수산자원보호협회
                  </span>
                </div>
              </div>

              <button
                onClick={copyOfficialCardUrl}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition shadow-xs active:scale-95 shrink-0"
              >
                {copied ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5" />}
                <span>{copied ? '복사됨' : '링크 복사'}</span>
              </button>
            </div>
          </header>

          {/* 메인 컨테이너 */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4 space-y-6">
            
            {/* [최상단] 마스터 메탈릭 VIP 자격 플레이트 */}
            <div className={`relative rounded-[32px] p-6 sm:p-8 text-white overflow-hidden transition-all ${themeMasterClass}`}>
              <div className="absolute inset-0 metallic-shimmer pointer-events-none"></div>

              <div className="relative z-10 pb-6 border-b border-white/15 space-y-3">
                <div className="flex flex-wrap items-center gap-2">
                  <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-black tracking-wider shadow-md ${themePlateClass}`}>
                    {renderStatusIcon(member.status)}
                    <span>{themeLabelText}</span>
                  </span>
                  <span className="inline-flex items-center px-2.5 py-1 text-[11px] font-bold bg-blue-500/20 text-blue-200 rounded-lg border border-blue-400/30 backdrop-blur-xs">
                    공무 확인용
                  </span>
                </div>

                <div className="pt-1">
                  <div className="inline-flex flex-col items-stretch">
                    <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-md whitespace-nowrap">
                      등록 회원 인증서
                    </h1>

                    <div 
                      onClick={() => member.profileImg && setPreviewDoc({ title: '프로필 패치 이미지', src: member.profileImg, isPdf: false })}
                      className="mt-4 relative w-full aspect-square rounded-2xl overflow-hidden border-2 border-white/40 shadow-2xl bg-zinc-900 cursor-pointer group"
                      title="클릭하여 확대 보기"
                    >
                      {member.profileImg ? (
                        <>
                          <img src={member.profileImg} alt={member.name} className="w-full h-full object-cover transition duration-300 group-hover:scale-105" />
                          <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                            <ZoomIn className="w-6 h-6 text-white" />
                          </div>
                        </>
                      ) : (
                        <div className="w-full h-full flex items-center justify-center font-black text-2xl text-white/40">KHIA</div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="pt-4 space-y-2.5">
                  <h2 className="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-sm">
                    {member.name}
                  </h2>

                  <div className="flex items-center gap-2 text-sm sm:text-base">
                    <span className="text-slate-400 font-semibold shrink-0">생년월일:</span>
                    <span className="font-bold text-slate-100 font-mono tracking-wider">{member.birth}</span>
                  </div>

                  <div className="flex flex-col sm:flex-row sm:items-center gap-2 pt-0.5">
                    <span className="text-slate-400 font-semibold text-sm sm:text-base shrink-0">소속단체:</span>
                    <div className="flex flex-wrap gap-1.5">
                      {orgBadgeList.map((org, i) => (
                        <span key={i} className={`px-2.5 py-1 rounded-lg text-xs font-bold border shadow-2xs ${getOrgBadgeStyle(org)}`}>
                          {org}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 pt-2">
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-black/50 border border-white/20 text-xs font-mono font-bold text-white shadow-inner">
                      <span className="text-amber-300 font-bold">인증코드:</span>
                      <span className="text-amber-300 font-black tracking-wider">{member.code}</span>
                    </div>
                    <span className="px-3 py-1 rounded-xl bg-white/10 border border-white/20 text-xs font-bold text-emerald-300">
                      신원인증 {member.identityAuth}
                    </span>
                  </div>
                </div>
              </div>

              <div className="relative z-10 mt-5 pt-4">
                <div className="flex items-end justify-between text-xs">
                  <div className="flex flex-col items-start text-xs">
                    <span className="text-slate-400 font-semibold mb-1 text-xs tracking-tight">
                      발급일자
                    </span>
                    {renderIssueDateFormatted(displayIssueDate, isApproved)}
                  </div>

                  <div className="flex flex-col items-start text-left font-mono font-bold tracking-widest text-amber-300 uppercase leading-tight text-xs">
                    <span>OFFICIAL VERIFIED</span>
                    <span>MEMBER</span>
                  </div>
                </div>
              </div> 
            </div>

            {/* [1순위] 안전관리요원 자격 증명 */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100 flex items-center gap-3">
                <div className="w-8 h-8 rounded-xl bg-amber-50 border border-amber-200/80 flex items-center justify-center text-amber-700 shadow-2xs">
                  <Zap className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="text-base font-bold text-slate-900 tracking-tight">안전관리요원 자격 증명</h3>
                  <p className="text-xs text-slate-500 mt-0.5">연안체험활동 법정 안전교육 이수 내역</p>
                </div>
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <span className="text-xs font-semibold text-slate-500 shrink-0">연안체험활동 법정 안전교육 이수 내역</span>
                  <div className="flex flex-wrap gap-1.5">
                    {safetyList.map((edu, i) => (
                      <span key={i} className={`px-2.5 py-1 rounded-lg border text-xs font-bold shadow-2xs ${getSafetyEduBadgeStyle(edu)}`}>
                        🎓 {edu}
                      </span>
                    ))}
                    {safetyList.length === 0 && (
                      <span className="text-xs text-slate-400">이수 내역 없음</span>
                    )}
                  </div>
                </div>

                <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <span className="text-xs font-semibold text-slate-500 shrink-0">보유 자격</span>
                  <div className="flex flex-wrap gap-1.5">
                    {qualList.map((qual, i) => (
                      <span key={i} className={`px-2.5 py-1 rounded-lg border text-xs font-bold shadow-2xs ${getQualificationBadgeStyle(i)}`}>
                        🎖️ {qual}
                      </span>
                    ))}
                    {qualList.length === 0 && (
                      <span className="text-xs text-slate-400">보유 자격 없음 (미취득)</span>
                    )}
                  </div>
                </div>

                <div className="py-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                      <ShieldCheck className="w-4 h-4 text-emerald-600" /> 공무 조회용 실물 정면 사진
                    </span>
                    {member.memberPhoto && (
                      <button
                        onClick={() => setPreviewDoc({ title: '공무 조회용 실물 정면 사진', src: member.memberPhoto, isPdf: false })}
                        className="text-[11px] font-bold text-[#14428B] hover:underline flex items-center gap-0.5"
                      >
                        <ZoomIn className="w-3.5 h-3.5" /> 확대 보기
                      </button>
                    )}
                  </div>
                  {member.memberPhoto ? (
                    <div 
                      onClick={() => setPreviewDoc({ title: '공무 조회용 실물 정면 사진', src: member.memberPhoto, isPdf: false })}
                      className="relative max-w-md rounded-2xl overflow-hidden border border-slate-200 cursor-pointer group"
                    >
                      <img src={member.memberPhoto} alt="공무용 정면사진" className="w-full h-auto block transition group-hover:scale-102" />
                    </div>
                  ) : (
                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-400">
                      등록된 실물 사진이 없습니다.
                    </div>
                  )}
                  <div className="flex flex-wrap items-center gap-4 text-xs text-slate-600 pt-1">
                    <div>성명: <b className="text-slate-900">{member.name}</b></div>
                    <div>생년월일: <b className="font-mono text-slate-900">{member.birth}</b></div>
                    <div>신원인증: <b className="text-emerald-700">{member.identityAuth}</b></div>
                  </div>
                </div>

                <div className="pt-5 space-y-4">
                  <span className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <Award className="w-4 h-4 text-purple-600" /> 항목별 매칭 자격 증빙 서류 ({certDocItems.length}건)
                  </span>

                  {certDocItems.length === 0 ? (
                    <p className="text-xs text-slate-400 py-1">해당 내역 없음 (첨부된 자격증빙 서류가 없습니다.)</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {certDocItems.map((doc, idx) => {
                        const isPdf = doc.mimeType === 'application/pdf' || (doc.dataUri && doc.dataUri.startsWith('data:application/pdf'));
                        const qualMatchIdx = qualList.findIndex(q => q === doc.label);
                        const badgeStyle = doc.category === '안전교육'
                          ? getSafetyEduBadgeStyle(doc.label)
                          : getQualificationBadgeStyle(qualMatchIdx >= 0 ? qualMatchIdx : idx);

                        return (
                          <div key={idx} className="space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                              <div className="flex items-center gap-1.5 min-w-0">
                                <span className={`px-2.5 py-0.5 rounded-md border text-[11px] font-bold truncate ${badgeStyle}`}>
                                  {doc.category === '안전교육' ? '🎓 ' : '🎖️ '}{doc.label}
                                </span>
                              </div>
                              <button
                                onClick={() => setPreviewDoc({ title: `${doc.label}`, src: doc.dataUri, isPdf })}
                                className="text-[11px] font-bold text-[#14428B] hover:underline shrink-0 flex items-center gap-0.5"
                              >
                                <ZoomIn className="w-3.5 h-3.5" /> {isPdf ? 'PDF 열람' : '확대 보기'}
                              </button>
                            </div>

                            <div 
                              onClick={() => setPreviewDoc({ title: `${doc.label}`, src: doc.dataUri, isPdf })}
                              className="relative w-full rounded-2xl overflow-hidden border border-slate-200 cursor-pointer group"
                            >
                              {isPdf ? (
                                <div className="text-center p-6 bg-slate-50 space-y-1">
                                  <div className="text-2xl">📄</div>
                                  <div className="text-xs font-bold text-slate-700">PDF 증빙 문서</div>
                                  <div className="text-[11px] text-[#14428B] font-semibold">클릭하여 전체화면으로 열람</div>
                                </div>
                              ) : (
                                <img src={doc.dataUri} alt={doc.label} className="w-full h-auto block transition group-hover:scale-102" />
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>
            </div>

            {/* [2순위] 어업 신고 유무 */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100 flex items-center gap-3">
                <div className="w-8 h-8 rounded-xl bg-cyan-50 border border-cyan-200 flex items-center justify-center text-cyan-800 shadow-2xs">
                  <NetIcon className="w-4.5 h-4.5" />
                </div>
                <h3 className="text-base font-bold text-slate-900">어업 신고 유무</h3>
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <span className="text-xs font-semibold text-slate-500">어업 신고 상태</span>
                  <div className="flex flex-wrap gap-1.5">
                    {splitBadges(member.fisheryReport).length > 0 ? (
                      splitBadges(member.fisheryReport).map((rep, i) => {
                        const isMaenson = rep.includes('맨손');
                        const badgeColor = isMaenson
                          ? 'bg-amber-50 border-amber-200 text-amber-900'
                          : 'bg-cyan-50 border-cyan-200 text-cyan-900';
                        return (
                          <span key={i} className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-bold shadow-2xs ${badgeColor}`}>
                            {renderFisheryItemIcon(rep)}
                            <span>{rep}</span>
                          </span>
                        );
                      })
                    ) : (
                      <span className="text-sm font-bold text-slate-900">
                        {member.fisheryReport || '어업 신고 없음 (순수 비어업인)'}
                      </span>
                    )}
                  </div>
                </div>

                <div className="pt-5 space-y-4">
                  <span className="text-xs font-bold text-slate-700 block">항목별 매칭 어업 신고증 증빙 서류 ({fisheryDocItems.length}건)</span>
                  {fisheryDocItems.length === 0 ? (
                    <p className="text-xs text-slate-400">등록된 어업 신고증 사본 없음</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {fisheryDocItems.map((doc, idx) => {
                        const isPdf = doc.mimeType === 'application/pdf' || (doc.dataUri && doc.dataUri.startsWith('data:application/pdf'));
                        return (
                          <div key={idx} className="space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                              <span className="inline-flex items-center gap-1.5 text-xs font-bold text-slate-900 truncate">
                                {renderFisheryItemIcon(doc.label)}
                                <span className="truncate">{doc.label}</span>
                              </span>
                              <button
                                onClick={() => setPreviewDoc({ title: `[어업 신고증] ${doc.label}`, src: doc.dataUri, isPdf })}
                                className="text-[11px] font-bold text-[#14428B] hover:underline shrink-0 flex items-center gap-0.5"
                              >
                                <ZoomIn className="w-3.5 h-3.5" /> {isPdf ? 'PDF 열람' : '확대 보기'}
                              </button>
                            </div>
                            <div 
                              onClick={() => setPreviewDoc({ title: `[어업 신고증] ${doc.label}`, src: doc.dataUri, isPdf })}
                              className="relative w-full rounded-2xl overflow-hidden border border-slate-200 cursor-pointer group"
                            >
                              {isPdf ? (
                                <div className="text-center p-6 bg-slate-50 space-y-1">
                                  <div className="text-2xl">📄</div>
                                  <div className="text-xs font-bold text-slate-700">PDF 어업 신고증</div>
                                  <div className="text-[11px] text-[#14428B] font-semibold">클릭하여 열람</div>
                                </div>
                              ) : (
                                <img src={doc.dataUri} alt={doc.label} className="w-full h-auto block transition group-hover:scale-102" />
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* [3순위] 주요 활동 지역 */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-center text-[#14428B] shadow-2xs">
                    <MapPin className="w-4 h-4" />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">주요 활동 지역</h3>
                    <p className="text-xs text-slate-500 mt-0.5">지역 기반 활동을 지원합니다.</p>
                  </div>
                </div>
                <span className="px-2.5 py-0.5 text-[10px] font-bold rounded-lg bg-blue-50 text-blue-800 border border-blue-200">
                  주소 자동 변환
                </span>
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex flex-col gap-1">
                  <span className="text-xs font-semibold text-slate-500">등록 도로명/지번 주소</span>
                  <span className="text-sm sm:text-base font-bold text-slate-900">
                    {cleanAddress || '주소 변환 결과 없음 (위경도 좌표 기준)'}
                  </span>
                </div>
                <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                  <span className="text-xs font-semibold text-slate-500">등록 GPS 원본 좌표</span>
                  <span className="text-xs font-mono text-slate-600 font-medium">
                    {member.activeLocation || '미등록'}
                  </span>
                </div>
              </div>
            </div>

            {/* [4순위] 현장 긴급 구호 (마스킹 해제 버튼 제거 & 즉시 전체 연락처 표시) */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-8 h-8 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-800 shadow-2xs shrink-0">
                    <Phone className="w-4 h-4" />
                  </div>
                  <div className="min-w-0">
                    <h3 className="text-base font-bold text-slate-900 leading-tight">현장 긴급 구호</h3>
                    <p className="text-xs text-slate-500 mt-0.5 leading-tight">응급 상황 연락 (본인 확인 완료)</p>
                  </div>
                </div>
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-500">회원 본인 휴대전화</span>
                  <a href={`tel:${fullPhoneDisplay.replace(/[^0-9]/g, '')}`} className="text-sm sm:text-base font-bold font-mono text-[#14428B] hover:underline transition">
                    📞 {fullPhoneDisplay}
                  </a>
                </div>
                <div className="py-4 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-500">가족 비상 연락처 (사고 대비)</span>
                  <a href={`tel:${fullEmergDisplay.replace(/[^0-9]/g, '')}`} className="text-sm sm:text-base font-bold font-mono text-rose-600 hover:underline transition">
                    🚨 {fullEmergDisplay}
                  </a>
                </div>
              </div>
            </div>

            {/* [5순위] 소속 및 커뮤니티 신원 */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100">
                <h3 className="text-base font-bold text-slate-900">소속 및 커뮤니티 신원</h3>
                <p className="text-xs text-slate-500 mt-0.5">협회 회원 확인에 사용됩니다.</p>
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <span className="text-xs font-semibold text-slate-500 shrink-0">소속 단체</span>
                  <div className="flex flex-wrap gap-1.5">
                    {orgBadgeList.map((org, i) => (
                      <span key={i} className={`px-2.5 py-1 rounded-lg text-xs font-bold border shadow-2xs ${getOrgBadgeStyle(org)}`}>
                        {org}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="py-4 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-500">협회 카페 가입 ID</span>
                  <span className="text-sm font-mono font-medium text-slate-900">{member.cafeId || '-'}</span>
                </div>

                <div className="py-4 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-500">협회 카페 활동 별명</span>
                  <span className="text-sm font-bold text-slate-900">{member.cafeNickname || '-'}</span>
                </div>

                <div className="py-4 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-500">프로필 패치 이미지</span>
                  <div className="flex items-center gap-3">
                    <div 
                      onClick={() => member.profileImg && setPreviewDoc({ title: '프로필 패치 이미지', src: member.profileImg, isPdf: false })}
                      className="w-12 h-12 rounded-xl overflow-hidden border border-slate-200 cursor-pointer group relative shrink-0 shadow-2xs"
                    >
                      {member.profileImg ? (
                        <img src={member.profileImg} alt="프로필" className="w-full h-full object-cover transition group-hover:scale-105" />
                      ) : (
                        <div className="w-full h-full flex items-center justify-center font-bold text-[10px] text-slate-400">KHIA</div>
                      )}
                    </div>
                    {member.profileImg && (
                      <button
                        onClick={() => setPreviewDoc({ title: '프로필 패치 이미지', src: member.profileImg, isPdf: false })}
                        className="text-xs font-bold text-[#14428B] hover:underline flex items-center gap-0.5"
                      >
                        <ZoomIn className="w-3.5 h-3.5" /> 확대 보기
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* [6순위] 심사 이력 및 공식 인증 보안키 */}
            <div className="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-[0_8px_25px_-5px_rgba(0,0,0,0.04)]">
              <div className="pb-4 border-b border-slate-100 space-y-2">
                <h3 className="text-base font-bold text-slate-900">심사 이력 및 공식 인증 보안키</h3>
                <p className="text-xs text-slate-500">협회 사무국 심사 결과 및 위·변조 방지 식별 코드입니다.</p>
                {renderSubmissionDate(member.submissionDate)}
              </div>

              <div className="divide-y divide-slate-100 text-sm">
                <div className="py-4 flex flex-col gap-1">
                  <span className="text-xs font-semibold text-slate-500">심사의견 및 검토자 메모</span>
                  <p className="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium">
                    {member.reviewerNote || '기록된 심사 메모가 없습니다.'}
                  </p>
                </div>

                <div className="pt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-900 text-white p-5 rounded-2xl shadow-sm">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center font-bold text-amber-300 shrink-0">
                      <Key className="w-4.5 h-4.5" />
                    </div>
                    <div>
                      <span className="text-[11px] text-slate-400 block font-medium">회원 고유 식별 코드</span>
                      <span className="text-lg sm:text-xl font-black font-mono tracking-widest text-emerald-400">
                        {member.code}
                      </span>
                    </div>
                  </div>
                  <button
                    onClick={copyMemberCode}
                    className="flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-white text-slate-900 hover:bg-slate-100 text-xs font-bold transition active:scale-95 shadow-sm shrink-0"
                  >
                    {codeCopied ? <Check className="w-3.5 h-3.5 text-emerald-600" /> : <Copy className="w-3.5 h-3.5 text-slate-700" />}
                    <span>{codeCopied ? '복사 완료' : '식별코드 복사'}</span>
                  </button>
                </div>
              </div>
            </div>

            {/* 협회 카페 바로가기 버튼 + 필기체 손글씨 슬로건 */}
            <div className="pt-6 pb-4 flex flex-col items-center justify-center text-center space-y-3">
              <a
                href="https://cafe.naver.com/khia230712"
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center justify-center gap-3 px-9 py-4.5 rounded-3xl bg-sky-50/90 hover:bg-sky-100 border-2 border-sky-200/90 text-[#0284C7] hover:text-[#0369A1] text-lg sm:text-xl font-black tracking-tight shadow-sm transition active:scale-95"
              >
                <span>협회 카페 바로가기</span>
              </a>
              <p className="font-handwriting text-2xl sm:text-3xl text-[#0369A1]/85 tracking-wide select-none">
                "가치 있는 의식, 같이 찾는 공존"
              </p>
            </div>

          </main>

          {/* 확대 보기 시 외곽 박스 없이 순수 이미지만 출력 */}
          {previewDoc && (
            <div 
              onClick={() => setPreviewDoc(null)}
              className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              {previewDoc.isPdf ? (
                <iframe 
                  src={previewDoc.src} 
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-4xl h-[85vh] rounded-xl bg-white shadow-2xl" 
                  title={previewDoc.title} 
                />
              ) : (
                <img 
                  src={previewDoc.src} 
                  alt={previewDoc.title} 
                  className="max-h-[92vh] max-w-[94vw] w-auto h-auto object-contain rounded-lg shadow-2xl select-none"
                />
              )}
            </div>
          )}

          <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 mt-4 shadow-2xs">
            <p className="font-semibold text-slate-700">사단법인 한국비어업인수산자원보호협회 (KHIA) eKYC 통합 관리 체계</p>
            <p className="mt-1 text-[11px] font-mono text-slate-400">본 인증서는 공무 확인 용도로 실시간 검증됩니다.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
